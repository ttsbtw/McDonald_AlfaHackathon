[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]
addopts = "-ra"
markers = ["postgres: requires TEST_DATABASE_URL pointing to an isolated PostgreSQL database"]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = ["app/scoring", "tests/scoring", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
